<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escuta · Transcrições</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path class="logo-bg" d="M20 4H44A16 16 0 0 1 60 20V36A16 16 0 0 1 44 52H30C22 52 14 57 6 60C5 54 4 48 4 40V20A16 16 0 0 1 20 4Z" stroke-width="2" stroke-linejoin="round"/><g fill="none" stroke-width="5" stroke-linecap="round"><path class="logo-bar" d="M14.5 24V32"/><path class="logo-bar" d="M23 19V37"/><path class="logo-bar" d="M31.5 15V41"/><path class="logo-bar" d="M40 21V35"/><path class="logo-cur" d="M49 20V36"/></g></svg>
        <h1>escuta<span class="cursor" aria-hidden="true"></span></h1>
      </div>
      <div class="filters">
        <label class="search">
          <span class="sr-only">Pesquisar</span>
          <input id="q" type="search" placeholder="Pesquisar no texto, no resumo ou no nome…" autocomplete="off" spellcheck="false" autofocus />
        </label>
        <label>
          <span class="sr-only">Tipo</span>
          <select id="kind">
            <option value="">Tudo</option>
            <option value="voice">Mensagens de voz</option>
            <option value="meeting">Reuniões</option>
          </select>
        </label>
        <label>
          <span class="sr-only">Conversa</span>
          <select id="chat"><option value="">Todas as conversas</option></select>
        </label>
      </div>
      <p id="count" class="count" role="status"></p>
    </header>

    <main id="list"></main>

    <p id="empty" class="empty" hidden></p>

    <script src="rec-db.js"></script>
    <script src="history.js"></script>
  </body>
</html>
